name: NeuroSQL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  production-smoke:
    name: Production API and database smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed API reaches the dedicated Neon database
        shell: bash
        run: |
          for attempt in $(seq 1 18); do
            if response=$(curl --fail --silent --show-error --max-time 10 https://neurosql-api.onrender.com/api/health/database); then
              echo "$response"
              if echo "$response" | grep -q '"status":"UP"' \
                && echo "$response" | grep -q '"database":"neurosql_db"' \
                && echo "$response" | grep -q '"postgresVersion":"17.11'; then
                echo "Production API and Neon database check passed."
                exit 0
              fi
              echo "Endpoint responded but did not report the expected database and version." >&2
              exit 1
            fi
            echo "Attempt $attempt: waiting for the Render API/database endpoint..."
            sleep 10
          done
          echo "Production API/database health check did not become ready." >&2
          exit 1
