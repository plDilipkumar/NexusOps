name: NeuroSQL CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'PROGRESS.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'PROGRESS.md'

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Test frontend durable-auth validation
        working-directory: frontend
        run: npm test
      - name: Build frontend with durable-auth screens enabled for mocked browser tests
        working-directory: frontend
        env:
          VITE_DURABLE_AUTH_ENABLED: "true"
        run: npm run build
      - name: Install Chromium for responsive and account-flow browser checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify responsive workspace navigation
        working-directory: frontend
        run: npm run test:responsive
      - name: Verify mocked registration, email verification, and password recovery flows
        working-directory: frontend
        run: npm run test:account-flows

  session-postgres-integration:
    name: Durable-auth and read-only SQL integration tests (PostgreSQL 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: neurosql_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neurosql_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run durable-auth and SQL integration tests against disposable PostgreSQL
        working-directory: backend
        env:
          NEUROSQL_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/neurosql_test
          NEUROSQL_TEST_DB_USERNAME: postgres
          NEUROSQL_TEST_DB_PASSWORD: postgres
        run: mvn -B -Dtest=JdbcSessionRepositoryPostgresIntegrationTest,WorkspaceAuthorizationPostgresIntegrationTest,JdbcAccountRepositoryPostgresIntegrationTest,DurableLoginPostgresIntegrationTest,DurableAuthHttpPostgresIntegrationTest,SharedLoginRateLimitHealthIndicatorPostgresIntegrationTest,JdbcAccountActionTokenRepositoryPostgresIntegrationTest,RegistrationServicePostgresIntegrationTest,PasswordResetServicePostgresIntegrationTest,ReadOnlyQueryExecutorPostgresIntegrationTest,JdbcQueryHistoryRepositoryPostgresIntegrationTest,SharedAccountRequestRateLimiterPostgresIntegrationTest test

  production-smoke:
    name: Production API and database smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, session-postgres-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed API reaches the dedicated Neon database
        shell: bash
        run: |
          for attempt in $(seq 1 18); do
            if response=$(curl --fail --silent --show-error --max-time 10 https://neurosql-api.onrender.com/api/health/database); then
              echo "$response"
              if echo "$response" | grep -q '"status":"UP"' \
                && echo "$response" | grep -q '"database":"neurosql_db"' \
                && echo "$response" | grep -q '"postgresVersion":"17.11'; then
                echo "Production API and Neon database check passed."
                exit 0
              fi
              echo "Endpoint responded but did not report the expected database and version." >&2
              exit 1
            fi
            echo "Attempt $attempt: waiting for the Render API/database endpoint..."
            sleep 10
          done
          echo "Production API/database health check did not become ready." >&2
          exit 1
