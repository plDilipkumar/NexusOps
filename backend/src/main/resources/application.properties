spring.application.name=neurosql-api
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,sharedLoginRateLimit
management.endpoint.health.show-details=never
spring.datasource.url=${JDBC_DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# Schema metadata is sensitive. It remains disabled until both auth and browser flags are enabled.
neurosql.schema-browser.enabled=${NEUROSQL_SCHEMA_BROWSER_ENABLED:false}
# SQL validation is a non-executing guardrail and remains disabled unless explicitly enabled.
neurosql.sql-validator.enabled=${NEUROSQL_SQL_VALIDATOR_ENABLED:false}
# Owner credentials are supplied only through deployment environment variables; never commit secrets.
neurosql.auth.enabled=${NEUROSQL_AUTH_ENABLED:false}
neurosql.auth.username=${NEUROSQL_AUTH_USERNAME:}
neurosql.auth.password=${NEUROSQL_AUTH_PASSWORD:}
# Durable multi-user authentication remains off until the proposed schema is approved and provisioned.
neurosql.auth.durable-sessions-enabled=${NEUROSQL_AUTH_DURABLE_SESSIONS_ENABLED:false}
neurosql.auth.expected-database=${NEUROSQL_AUTH_EXPECTED_DATABASE:neurosql_db}

# Shared durable-login throttling is disabled until the V3 schema and runtime secret are approved/configured.
neurosql.auth.shared-rate-limit-enabled=${NEUROSQL_AUTH_SHARED_RATE_LIMIT_ENABLED:false}
neurosql.auth.rate-limit-hmac-key=${NEUROSQL_AUTH_RATE_LIMIT_HMAC_KEY:}

# Verification email delivery is opt-in. SMTP uses standard SPRING_MAIL_* environment properties.
# Do not enable until the schema, restricted runtime role, HMAC key, and provider settings are approved.
neurosql.auth.email.enabled=${NEUROSQL_AUTH_EMAIL_ENABLED:false}
neurosql.auth.email.from=${NEUROSQL_AUTH_EMAIL_FROM:}
neurosql.auth.email.verification-url=${NEUROSQL_AUTH_EMAIL_VERIFICATION_URL:}

# SMTP is only used when the gated verification sender is enabled. Require authentication
# and STARTTLS by default; provider-specific settings may be overridden via environment.
spring.mail.properties[mail.smtp.auth]=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties[mail.smtp.starttls.required]=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties[mail.smtp.connectiontimeout]=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties[mail.smtp.timeout]=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties[mail.smtp.writetimeout]=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}
