spring.application.name=neurosql-api
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,sharedLoginRateLimit
management.endpoint.health.show-details=never
spring.datasource.url=${JDBC_DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# Schema metadata is sensitive. It remains disabled until both auth and browser flags are enabled.
neurosql.schema-browser.enabled=${NEUROSQL_SCHEMA_BROWSER_ENABLED:false}
# SQL validation is a non-executing guardrail and remains disabled unless explicitly enabled.
neurosql.sql-validator.enabled=${NEUROSQL_SQL_VALIDATOR_ENABLED:false}
# Owner credentials are supplied only through deployment environment variables; never commit secrets.
neurosql.auth.enabled=${NEUROSQL_AUTH_ENABLED:false}
neurosql.auth.username=${NEUROSQL_AUTH_USERNAME:}
neurosql.auth.password=${NEUROSQL_AUTH_PASSWORD:}
# Durable multi-user authentication remains off until the proposed schema is approved and provisioned.
neurosql.auth.durable-sessions-enabled=${NEUROSQL_AUTH_DURABLE_SESSIONS_ENABLED:false}
neurosql.auth.expected-database=${NEUROSQL_AUTH_EXPECTED_DATABASE:neurosql_db}

# Shared durable-login throttling is disabled until the V3 schema and runtime secret are approved/configured.
neurosql.auth.shared-rate-limit-enabled=${NEUROSQL_AUTH_SHARED_RATE_LIMIT_ENABLED:false}
neurosql.auth.rate-limit-hmac-key=${NEUROSQL_AUTH_RATE_LIMIT_HMAC_KEY:}

# Verification email delivery is opt-in. SMTP uses standard SPRING_MAIL_* environment properties.
# Configure only operator-controlled reverse-proxy CIDRs before enabling IP quotas; arbitrary X-Forwarded-For is ignored.
neurosql.security.trusted-proxy-cidrs=${NEUROSQL_SECURITY_TRUSTED_PROXY_CIDRS:}
# Do not enable until the schema, restricted runtime role, HMAC key, and provider settings are approved.
neurosql.auth.email.enabled=${NEUROSQL_AUTH_EMAIL_ENABLED:false}
neurosql.auth.email.from=${NEUROSQL_AUTH_EMAIL_FROM:}
neurosql.auth.email.verification-url=${NEUROSQL_AUTH_EMAIL_VERIFICATION_URL:}
neurosql.auth.email.password-reset-url=${NEUROSQL_AUTH_EMAIL_PASSWORD_RESET_URL:}

# SQL execution is opt-in and requires an authenticated caller plus a dedicated read-only PostgreSQL role.
# The executor independently checks that role and enforces a read-only transaction for every request.
neurosql.sql-execution.enabled=${NEUROSQL_SQL_EXECUTION_ENABLED:false}
neurosql.sql-execution.expected-role=${NEUROSQL_SQL_EXECUTION_EXPECTED_ROLE:neurosql_sql_readonly}
# Separate read-only SQL data plane; never fall back to the application/authentication datasource.
# Configure these only after a dedicated least-privilege Neon LOGIN role has been verified.
neurosql.sql-execution.jdbc-url=${NEUROSQL_SQL_JDBC_URL:}
neurosql.sql-execution.username=${NEUROSQL_SQL_DATABASE_USERNAME:}
neurosql.sql-execution.password=${NEUROSQL_SQL_DATABASE_PASSWORD:}
neurosql.sql-execution.max-rows=${NEUROSQL_SQL_EXECUTION_MAX_ROWS:500}
neurosql.sql-execution.timeout-seconds=${NEUROSQL_SQL_EXECUTION_TIMEOUT_SECONDS:5}

# SMTP is only used when the gated verification sender is enabled. Require authentication
# and STARTTLS by default; provider-specific settings may be overridden via environment.
spring.mail.properties[mail.smtp.auth]=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties[mail.smtp.starttls.required]=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties[mail.smtp.connectiontimeout]=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties[mail.smtp.timeout]=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties[mail.smtp.writetimeout]=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

# Query history is disabled until the proposed V5 schema and application runtime grants are approved.
neurosql.sql-history.enabled=${NEUROSQL_SQL_HISTORY_ENABLED:false}

# Saved queries remain disabled until the proposed V5 schema and application runtime grants are approved.
neurosql.saved-queries.enabled=${NEUROSQL_SAVED_QUERIES_ENABLED:false}


# AI SQL drafting is disabled by default. Enable only with durable workspace auth,
# the shared PostgreSQL limiter, and a dedicated OpenAI-compatible HTTPS provider.
# Keep provider credentials in Render environment variables, never in source control.
neurosql.ai.sql-generation.enabled=${NEUROSQL_AI_SQL_GENERATION_ENABLED:false}
neurosql.ai.sql-generation.endpoint=${NEUROSQL_AI_SQL_GENERATION_ENDPOINT:}
neurosql.ai.sql-generation.api-key=${NEUROSQL_AI_SQL_GENERATION_API_KEY:}
neurosql.ai.sql-generation.model=${NEUROSQL_AI_SQL_GENERATION_MODEL:}
neurosql.ai.sql-generation.connect-timeout=${NEUROSQL_AI_SQL_GENERATION_CONNECT_TIMEOUT:3s}
neurosql.ai.sql-generation.read-timeout=${NEUROSQL_AI_SQL_GENERATION_READ_TIMEOUT:20s}
